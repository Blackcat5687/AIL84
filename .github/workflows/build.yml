name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets are only ever referenced here, inside env: - never directly inside an if:
      # expression, which GitHub Actions' workflow parser rejects (see the "Unrecognized
      # named-value: 'secrets'" validation error that surfaced when if: compared secrets.X
      # directly). Every later if: below checks this plain env var instead.
      HAS_RELEASE_SIGNING: ${{ secrets.NOTESLINK_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Decode release keystore
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          NOTESLINK_KEYSTORE_BASE64: ${{ secrets.NOTESLINK_KEYSTORE_BASE64 }}
        run: echo "$NOTESLINK_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/notelink-release.keystore"

      - name: Build signed release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          NOTESLINK_KEYSTORE_PATH: ${{ github.workspace }}/notelink-release.keystore
          NOTESLINK_KEYSTORE_PASSWORD: ${{ secrets.NOTESLINK_KEYSTORE_PASSWORD }}
          NOTESLINK_KEY_ALIAS: ${{ secrets.NOTESLINK_KEY_ALIAS }}
          NOTESLINK_KEY_PASSWORD: ${{ secrets.NOTESLINK_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload signed release APK artifact
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
